name: Refresh profile (card + latest writing)

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - neofetch.json
      - assets/**
      - scripts/generate_card.py

permissions:
  contents: write

concurrency:
  group: neofetch
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install "pillow>=10"

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_card.py --config neofetch.json --out dist

      - name: Refresh latest writing from jaimeyan.com RSS
        run: python scripts/update_feed.py --readme README.md --limit 5

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.svg README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh profile card and latest writing [skip ci]"
          git push
